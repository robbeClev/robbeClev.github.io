<!DOCTYPE html>
<html>
<head>
    <title>Homepage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
</head>
<body>

<div class="w3-bar w3-green">
    <div class="w3-bar-item">Homepage</div>
</div>

<div class="w3-container">
    <h2>Welcome</h2>
    <div class="w3-card-4">
        <img src="../pokemon/001.png" alt="Avatar" style="width:100%">
        <div class="w3-container w3-center">
            <h3>Ben Dover</h3>
            <p class="w3-text-gray">#001</p>
            <p class="w3-button w3-yellow w3-round-xxlarge">Green</p>
            <p>HP 45 - Speed 45</p>
        </div>
    </div>
    
    <div class="w3-card-4">
        <img src="../pokemon/025.png" alt="Avatar" style="width:100%">
        <div class="w3-container w3-center">
            <h3>Ishowspeed</h3>
            <p class="w3-text-gray">#025</p>
            <p class="w3-button w3-yellow w3-round-xxlarge">Lightning</p>
            <p>HP 45 - Speed 90</p>
        </div>
    </div>
</div>

</body>
</html>
